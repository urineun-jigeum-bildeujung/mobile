# PR 품질 게이트. 스토어 배포는 별도로 다루고, 이 워크플로우는 코드 품질만 본다.
#
# Gradle 빌드는 넣지 않는다. 로컬 첫 빌드가 9분 39초 걸렸고 이 저장소의 변경은
# 대부분 JS 한 파일 수준이라 매 PR마다 돌릴 이득이 적다. 네이티브 설정(app.json·
# config plugin)을 실제로 만지기 시작하면 그때 추가한다.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 검사만 하는 워크플로우다. checkout에 필요한 읽기만 준다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 검증 (typecheck·format·lint)
    runs-on: ubuntu-latest
    # 기본값(6시간)으로 두면 어딘가 멈췄을 때 아무도 모른 채 러너만 물고 있는다.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 포맷 검사
        run: npm run format:check

      - name: 린트
        run: npm run lint
