name: 🐛 버그 신고
description: 앱 동작이 기대와 다를 때
title: 'fix: '
labels: [fix]
body:
  - type: markdown
    attributes:
      value: |
        **화면 안에서 일어나는 문제는 [web 저장소](https://github.com/urineun-jigeum-bildeujung/web/issues/new/choose)로 보내주십시오.**
        이 저장소는 앱 셸(WebView·네이티브 권한·스토어)만 다룹니다.
        웹 브라우저에서도 같은 증상이 재현된다면 웹 쪽 문제입니다.
  - type: textarea
    id: what
    attributes:
      label: 무엇이 잘못됐나
      description: 어떤 문제가 있는지 한두 줄로.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      placeholder: |
        1. 앱 실행
        2. 상품 상세로 이동
        3. 기기 뒤로가기 버튼을 누른다
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 환경
      options:
        - Android 에뮬레이터
        - Android 실기기
        - iOS 시뮬레이터
        - iOS 실기기
        - 여러 환경에서 재현
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS 버전 (선택)
      placeholder: Android 16 (API 37)
  - type: checkboxes
    id: web_check
    attributes:
      label: 웹에서도 재현되는지 확인
      description: 같은 주소를 브라우저에서 열어 확인하십시오. 양쪽 다 재현되면 web 저장소 이슈입니다.
      options:
        - label: 브라우저에서는 정상 동작한다 (앱에서만 발생하는 문제다)
  - type: textarea
    id: extra
    attributes:
      label: 스크린샷 / logcat (선택)
      description: '`adb logcat` 출력이나 화면 캡처가 있으면 원인을 훨씬 빨리 찾습니다.'
