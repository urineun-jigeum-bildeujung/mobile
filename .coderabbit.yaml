# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: 시니어 모바일 엔지니어 관점에서 한국어로 간결하게 리뷰한다. 지적할 때는 근거가 되는 문서를 함께 언급한다.
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  request_changes_workflow: false
  auto_title_instructions: '제목은 `유형(#이슈번호): 내용` 형식을 유지한다. 유형은 feat·fix·refactor·style·test·chore·docs·design 중 하나이며, 이 유형으로 라벨이 자동 부착되므로 바꾸지 않는다.'
  auto_review:
    enabled: true
    base_branches:
      - dev
      - main
  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: >-
        규칙의 출처는 AGENTS.md다. 이 저장소는 웹을 감싸는 WebView 셸이고 화면·
        비즈니스 로직·API 호출은 web 저장소가 담당한다. 셸 범위를 벗어나 화면이나
        도메인 로직이 들어오지 않는지 먼저 본다. 그 밖에 확인할 것 — 새 소스 파일
        첫 줄에 한국어 역할 주석이 있는지, 화면 하나짜리 앱에 불필요한 추상화를
        세우지 않는지, WebView 관련 콜백에서 상태를 과하게 들고 있지 않은지,
        Android와 iOS 동작이 갈리는 코드에 사유가 적혀 있는지 확인한다.
    - path: app.json
      instructions: >-
        패키지 ID(`ios.bundleIdentifier`·`android.package`)를 바꾸는 변경은 막는다.
        스토어 등록 후에는 변경이 불가능하므로 등록 전 확정이 필요하고, 바뀌면
        기존 설치본과 다른 앱이 된다. 네이티브 설정이 늘어나면 android/·ios/를
        직접 고치는 대신 여기나 config plugin에 있는지 확인한다.
    - path: '{android,ios}/**'
      instructions: >-
        이 폴더는 .gitignore 대상이고 prebuild가 매번 다시 생성한다. 커밋에
        포함됐다면 실수이므로 지적한다. 네이티브 설정은 app.json이나 config
        plugin으로 옮겨야 다음 prebuild에서 살아남는다.
    - path: package.json
      instructions: >-
        Expo SDK와 react-native 버전은 서로 묶여 있다. 개별 패키지를 임의 버전으로
        올리는 변경은 `npx expo install`로 SDK에 맞는 버전을 쓰는지 확인한다.
        의존성을 추가·제거했다면 README.md의 안내가 여전히 맞는지 본다.
    - path: '**'
      instructions: >-
        PR 본문에 Closes #N 형태로 연결된 이슈가 있는지 확인한다. 없으면
        "모든 작업은 이슈에서 시작한다"는 규칙 위반이므로 이슈 생성을 요청한다.
        브랜치명도 유형/도메인/#이슈번호-설명 형식이어야 하며, #0처럼 실재하지
        않는 번호가 들어 있으면 지적한다.
    - path: CHANGELOG.md
      instructions: >-
        이번 PR의 변경이 오늘 날짜 섹션 아래 사람이 읽을 문장으로 기록됐는지,
        분류(추가·변경·수정·제거·개발 환경)가 맞는지, (#이슈번호)가 붙었는지 본다.
        최신 날짜가 위에 오는지, 커밋 메시지를 그대로 복사한 항목은 없는지 확인한다.
